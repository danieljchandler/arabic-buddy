# Writes the caller's own grammar mastery. Stated explicitly rather than relying
# on the platform default — this one writes learner data, so the requirement
# should be visible here as well as enforced in the function.
[functions.record-grammar-outcome]
verify_jwt = true

# Captures transcript corrections into training_examples before the admin save
# overwrites them. Role-gated inside (admin / content_reviewer only).
[functions.record-transcript-corrections]
verify_jwt = true

# Learner reports (thumbs-down, "this looks wrong") into the native-review
# queue. Capped per day; reports only become training data after a native
# speaker corrects them.
[functions.report-content]
verify_jwt = true

# Populates the semantic content index (pgvector). Admin-gated inside — each
# run embeds a bounded slice; loop until it reports embedded: 0.
[functions.embed-content]
verify_jwt = true

# Learner referral codes: get-or-create my code, redeem someone else's.
# Rewards are Stripe-side, conversion-gated (see check-subscription).
[functions.referral]
verify_jwt = true

# Paid native feedback: credit ledger, submissions into the reviewers' queue,
# Stripe one-off credit packs (dark until STRIPE_FEEDBACK_PACK_PRICE is set).
[functions.native-feedback]
verify_jwt = true

# Written production (C3): dialect writing prompts and Rulebook-corrected
# reviews of the learner's typed Arabic. Tier-capped inside.
[functions.writing-coach]
verify_jwt = true

# Nightly batch that pre-builds daily stories for recently-active learners.
# Run on a schedule shortly after 00:00 UTC with the service-role key (a
# valid JWT, so verify_jwt = true does not block the scheduler); also
# runnable by an admin. Guarded inside as well.
[functions.pregenerate-daily]
verify_jwt = true

# AI triage for content shared into the app (Web Share Target → /share page).
# One cheap forced-tool-call classification; usage-capped inside, and the
# /share flow only runs signed in, so requiring a JWT costs nothing.
[functions.screen-shared-content]
verify_jwt = true

# One-step admin ingestion of a shared TikTok/YouTube/Instagram link into the
# Discover pipeline. Admin-role-checked inside; kicks process-approved-video
# server-to-server with the service-role key.
[functions.ingest-shared-video]
verify_jwt = true

# Clip-pipeline mining: expands a concept's dialect realizations into caption
# index searches and writes pending clip_candidates. Content-manager-role
# checked inside; the automation loop calls with the service-role key (a valid
# JWT, so verify_jwt = true does not block it) plus the CLIP_PIPELINE_SECRET
# header.
[functions.mine-clip-candidates]
verify_jwt = true

# Clip-pipeline verification stack (term/markers/playability/LLM judge) that

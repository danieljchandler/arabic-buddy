# Admin / pipeline functions — MUST verify JWT.
# Called from authed admin flows (user JWT) and server-to-server from
# extract-visual-context (service-role key — a valid JWT), so requiring a
# valid JWT here does not break the pipeline.
[functions.process-approved-video]
verify_jwt = true

# Re-reads a stored video's on-screen text on demand. Admin-gated inside (or an
